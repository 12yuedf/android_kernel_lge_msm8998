name: Build LG V30 (joan) kernel - 4K fix

# ============================================================
# v3.4锛欳lang 鏋勫缓 + 姝ｇ‘鐨?4K 淇锛坒bdev MDSS 璺緞锛? 鑷寘鍚?boot.img 閲嶆墦鍖?# 璇存槑锛?#   - 鏋勫缓鏂瑰紡娌跨敤宸查獙璇佸彲鐢ㄧ殑鏂规锛圕lang + lineageos_joan_defconfig + O=out锛?#   - 4K 淇鎵撳湪鐪熷疄鐢熸晥鐨勮矾寰勪笂锛歞rivers/video/fbdev/msm/mdss_hdmi_edid.c
#     锛坖oan 鐨?HDMI/DP 杈撳嚭璧?fbdev MDSS 鏍堬紝lineageos_joan_defconfig 鏃?DRM_MSM锛?#   - 鍐呮牳婧愮爜 + 缂栬瘧浜х墿浼氱紦瀛橈紝绗簩娆¤捣璺宠繃 clone/patch/defconfig锛?#     鍙閲忕紪璇戞敼鍔ㄨ繃鐨勬枃浠讹紙绾?5~10 鍒嗛挓锛?#   - v3.4 淇锛欰OSP 鏂扮増 unpack_bootimg.py 涓嶅啀杈撳嚭 boot_info.json 瀵艰嚧鎵撳寘澶辫触銆?#     鐜板湪鏀逛负鍐呭祵 Python 鐩存帴瑙ｆ瀽鍘?boot.img 澶撮儴 -> 鎹㈠唴鏍?-> 閲嶆墦鍖咃紝
#     header 閲屾墍鏈夊瓧娈碉紙cmdline / os_version / 鍚勫湴鍧€ / page_size锛夊師鏍蜂繚鐣欙紝
#     涓嶄緷璧栦换浣曞閮ㄥ伐鍏凤紝涔熶笉闇€瑕佷粠 googlesource 涓嬭浇 mkbootimg銆?# 浣跨敤鍓嶆彁锛?#   - 琛ヤ竵鏂囦欢宸蹭笂浼犲埌鏈粨搴?lineage-22.2 鍒嗘敮鏍圭洰褰曪細
#     0001-sde-hdmi-edid-drop-DCI-4K-force-UHD-3840x2160.patch
#   - boot.img 宸蹭笂浼犲埌鏈粨搴?lineage-22.2 鍒嗘敮鏍圭洰褰曪紙閲嶆墦鍖呯敤锛?#   - 浠撳簱椤?Actions -> 鏈伐浣滄祦 -> Run workflow锛坆oot_img_url 鐣欑┖锛?# ============================================================

on:
  workflow_dispatch:
    inputs:
      boot_img_url:
        description: '锛堝鐢級澶栭儴 boot.img 鐩撮摼銆備粨搴撴牴鐩綍宸叉湁 boot.img 鏃朵紭鍏堢敤浠撳簱鏂囦欢锛屾棤闇€濉椤广€?
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout this repo (workflow + patch)
        uses: actions/checkout@v4

      - name: Restore kernel source + build cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/kernel
          key: joan4k-kernel-${{ hashFiles('0001-sde-hdmi-edid-drop-DCI-4K-force-UHD-3840x2160.patch') }}

      - name: Clone LineageOS kernel source (only when no cache)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          # 鑷垜淇濇姢锛氳嫢 kernel 鐩綍宸插瓨鍦紙渚嬪缂撳瓨鎭㈠锛夊垯璺宠繃 clone
          if [ -f kernel/Makefile ] && [ -d kernel/.git ]; then
            echo "==> kernel source already present, skipping clone"
          else
            rm -rf kernel
            git clone --depth=1 -b lineage-22.2 https://github.com/LineageOS/android_kernel_lge_msm8998.git kernel
          fi

      - name: Download and apply 4K patch (idempotent, safe with cache)
        run: |
          set -e
          cd kernel
          # 浼樺厛鐢?yueddff锛屽け璐ュ垯鍥為€€ 12yuedf锛堜袱涓敤鎴峰悕閮借瘯锛屾€绘湁涓€涓兘涓嬪埌锛?          curl -fsSL -o /tmp/fix.patch \
            "https://raw.githubusercontent.com/yueddff/android_kernel_lge_msm8998/lineage-22.2/0001-sde-hdmi-edid-drop-DCI-4K-force-UHD-3840x2160.patch" \
            || curl -fsSL -o /tmp/fix.patch \
            "https://raw.githubusercontent.com/12yuedf/android_kernel_lge_msm8998/lineage-22.2/0001-sde-hdmi-edid-drop-DCI-4K-force-UHD-3840x2160.patch"
          if git apply --check /tmp/fix.patch 2>/dev/null; then
            git apply /tmp/fix.patch
            echo "==> 4K patch applied"
          elif git apply -R --check /tmp/fix.patch 2>/dev/null; then
            echo "==> 4K patch already applied (from cache)"
          else
            echo "!! patch state unknown, forcing apply"
            git apply /tmp/fix.patch
          fi
          git diff --stat

      - name: Apply idle-power-collapse patch (fix ~8fps video stutter)
        run: |
          set -e
          cd kernel
          python3 - <<'PYEOF'
          import io
          p = 'drivers/video/fbdev/msm/mdss_mdp.c'
          s = io.open(p, encoding='utf-8', errors='surrogateescape').read()
          old = '\tmdata->idle_pc_enabled = of_property_read_bool(pdev->dev.of_node,\n\t\t "qcom,mdss-idle-power-collapse-enabled");'
          new = '\t/* DSH PATCH: keep MDP powered, avoid cmd-panel idle collapse (TE -> ~8Hz) */\n\tmdata->idle_pc_enabled = false;'
          if old in s:
              io.open(p, 'w', encoding='utf-8', errors='surrogateescape').write(s.replace(old, new, 1))
              print('==> idle_pc patched')
          elif 'mdata->idle_pc_enabled = false;' in s:
              print('==> idle_pc already patched')
          else:
              raise SystemExit('ERROR: idle_pc pattern not found')
          PYEOF
          grep -n "idle_pc_enabled" drivers/video/fbdev/msm/mdss_mdp.c | head
      - name: Install dependencies (incl. clang toolchain)
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git git-lfs gnupg gperf imagemagick lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu
          sudo apt-get install -y gcc-arm-linux-gnueabi g++-arm-linux-gnueabi
          sudo apt-get install -y clang
          clang --version | head -1

      - name: Build kernel (Clang, incremental when cache hit)
        id: build
        run: |
          set -e
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang
          export REAL_CC=clang

          # 鍏抽棴灞€閮ㄧ殑 -Werror / -Werror=xxx锛堝 tfa9872 鐨?ccflags-y += -Werror锛?          # Clang 浼氭妸"璇鎬х缉杩?绛夎鍛婂崌绾т负閿欒瀵艰嚧缂栬瘧澶辫触锛涘箓绛夛紝缂撳瓨涓嬮噸澶嶆墽琛屾棤瀹筹級
          sed -i 's/KBUILD_CFLAGS\t+= -Werror/KBUILD_CFLAGS += -Wno-error/' Makefile
          find . -name Makefile -not -path './.git/*' -exec sed -i \
            's/ccflags-y\s*+=\s*-Werror$/ccflags-y += -Wno-error/; s/ -Werror=/ -Wno-error=/g' {} +

          # 鏈夌紦瀛橈紙out/.config 宸插瓨鍦級鍒欒烦杩?defconfig锛岀洿鎺ュ閲忕紪璇?          if [ ! -f out/.config ]; then
            echo "==> Using defconfig: lineageos_joan_defconfig"
            make O=out lineageos_joan_defconfig
          else
            echo "==> Cache hit: using existing .config, incremental build"
          fi

          make O=out -j"$(nproc)" Image.gz-dtb KCFLAGS="-Wno-error" CONFIG_WERROR=n

          echo "==> Build artifacts:"
          ls -lh out/arch/arm64/boot/Image.gz-dtb
          mkdir -p out/final
          cp out/arch/arm64/boot/Image.gz-dtb out/final/Image.gz-dtb
          echo "built=yes" >> "$GITHUB_OUTPUT"

      - name: Repack boot.img with new kernel (self-contained, no mkbootimg needed)
        if: steps.build.outputs.built == 'yes'
        run: |
          set -e
          cd kernel
          # 浼樺厛鐢ㄤ粨搴撴牴鐩綍鐨?boot.img锛堜笂浼犲埌鏈粨搴撻粯璁ゅ垎鏀嵆鍙級锛屽惁鍒欑敤杈撳叆鐨勫鐢?URL
          if [ -f ../boot.img ]; then
            echo "==> Using boot.img from this repo"
            cp ../boot.img /tmp/stock-boot.img
          elif [ -n "${{ github.event.inputs.boot_img_url }}" ]; then
            echo "==> Downloading boot.img: ${{ github.event.inputs.boot_img_url }}"
            curl -L -o /tmp/stock-boot.img "${{ github.event.inputs.boot_img_url }}"
          else
            echo "==> No boot.img found, skipping repack (kernel only)"
            exit 0
          fi
          ls -lh /tmp/stock-boot.img

          echo "==> Repacking (parse original header -> swap kernel -> rebuild)"
          python3 - /tmp/stock-boot.img out/final/Image.gz-dtb out/final/boot.img <<'PYEOF'
          import struct, sys

          boot_src, kernel_src, out_path = sys.argv[1], sys.argv[2], sys.argv[3]
          data = open(boot_src, 'rb').read()
          assert data[:8] == b'ANDROID!', 'ERROR: not an Android boot image'

          def u32(o):
              return struct.unpack_from('<I', data, o)[0]

          page_size = u32(36)
          header_version = u32(52)          # v1+ 鏃惰瀛楁鏄?1/2/3/4锛泇0 閲岃鍋忕Щ鏄?cmdline 鍐呭锛圓SCII锛夛紝涓嶄細鏄?1~4
          if header_version in (1, 2, 3, 4):
              sys.exit('ERROR: header_version %d not supported (LG V30 boot.img is v0)' % header_version)
          header_size = 1616                # v0锛氭棤 header_size/header_version 瀛楁锛宑mdline 浠?48 寮€濮?          id_off = 560                      # cmdline(48..559) -> id(560..591) -> extra_cmdline(592..1615)

          kernel_size = u32(8)
          ramdisk_size = u32(16)
          second_size = u32(24)

          def pad(n):
              return ((n + page_size - 1) // page_size) * page_size

          pos = page_size                   # 绗竴椤垫斁 header
          kernel = data[pos:pos + kernel_size]; pos += pad(kernel_size)
          ramdisk = data[pos:pos + ramdisk_size]; pos += pad(ramdisk_size)
          second = data[pos:pos + second_size] if second_size else b''
          print('header_version=0 page_size=%d kernel=%d ramdisk=%d second=%d' %
                (page_size, len(kernel), len(ramdisk), len(second)))

          new_kernel = open(kernel_src, 'rb').read()
          out = bytearray(page_size)
          out[:header_size] = data[:header_size]            # 鍘熸牱淇濈暀 header 鍏ㄩ儴瀛楁锛坈mdline/os_version/鍦板潃绛夛級
          struct.pack_into('<I', out, 8, len(new_kernel))   # 浠呮洿鏂?kernel_size
          out[id_off:id_off + 32] = b'\x00' * 32            # 娓呯┖ id锛坆ootloader 涓嶆牎楠岋級

          out += new_kernel
          out += b'\x00' * (pad(len(new_kernel)) - len(new_kernel))
          out += ramdisk
          out += b'\x00' * (pad(len(ramdisk)) - len(ramdisk))
          if second:
              out += second
              out += b'\x00' * (pad(len(second)) - len(second))

          open(out_path, 'wb').write(bytes(out))
          print('WROTE %s (%d bytes)' % (out_path, len(out)))
          PYEOF
          ls -lh out/final/boot.img

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: joan-4k-kernel
          path: |
            ${{ github.workspace }}/kernel/out/final/Image.gz-dtb
            ${{ github.workspace }}/kernel/out/final/boot.img
          if-no-files-found: warn

      - name: Save kernel cache (for next run)
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/kernel
          key: joan4k-kernel-${{ hashFiles('0001-sde-hdmi-edid-drop-DCI-4K-force-UHD-3840x2160.patch') }}

      - name: Build summary
        run: |
          echo "## 鏋勫缓瀹屾垚" >> "$GITHUB_STEP_SUMMARY"
          echo "- 鍐呮牳(鍚獶TB): \`Image.gz-dtb\`" >> "$GITHUB_STEP_SUMMARY"
          if ls ${{ github.workspace }}/kernel/out/final/boot.img 2>/dev/null; then
            echo "- 鍙埛鍐欓暅鍍? \`boot.img\`" >> "$GITHUB_STEP_SUMMARY"
            echo "  鍒峰叆: \`fastboot flash boot boot.img\`" >> "$GITHUB_STEP_SUMMARY"
          fi
