# LineageOS 17.1 (Android 10) 内核构建 + 4K 补丁 + 重打包 boot.img
# 源: SGCMarkus/android_kernel_lge_msm8998 @ lineage-17.1 (LG V30 joan, 内核 4.4.153)
name: Build Kernel 17.1 + Repack Boot

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel (lineage-17.1)
        uses: actions/checkout@v4
        with:
          repository: SGCMarkus/android_kernel_lge_msm8998
          ref: lineage-17.1
          path: kernel

      - name: Download 4K EDID patch and apply
        run: |
          cd kernel
          curl -fL -o 0001-sde-hdmi-edid-4k-fix-lineage-17.1.patch \
            "https://raw.githubusercontent.com/yueddff/android_kernel_lge_msm8998/lineage-22.2/0001-sde-hdmi-edid-4k-fix-lineage-17.1.patch" \
            || { echo "patch not found"; exit 1; }
          git apply --verbose 0001-sde-hdmi-edid-4k-fix-lineage-17.1.patch
          echo "4K patch applied OK"

      - name: Fix tspdrv.h
        run: |
          cd kernel
          python3 -c "
          import os
          p='include/uapi/linux/tspdrv.h'
          if os.path.exists(p):
              s=open(p).read()
              if '#include <sys/ioctl.h>' in s:
                  s=s.replace('#include <sys/ioctl.h>',
                    '#ifdef __KERNEL__\n#include \"ioctl.h\"\n#else\n#include <sys/ioctl.h>\n#endif',1)
                  open(p,'w').write(s)
                  print('tspdrv fixed')
              else: print('tspdrv ok')
          else: print('no tspdrv')
          "

      - name: Fix nested functions in VIDC driver (clang incompatible)
        run: |
          cd kernel
          python3 <<'PY'
          import re, glob

          def extract_nested_helper(content, helper_name):
              pattern = r'(?:^|\n)([ \t]*)void ' + re.escape(helper_name) + r'\s*\([^)]*\)\s*\n[ \t]*\{'
              m = re.search(pattern, content)
              if not m:
                  return content, False
              start = m.start()
              brace_pos = content.index('{', m.end() - 1)
              depth = 1
              pos = brace_pos + 1
              while depth > 0 and pos < len(content):
                  if content[pos] == '{': depth += 1
                  elif content[pos] == '}': depth -= 1
                  pos += 1
              helper_block = content[m.start():pos]
              before = content[:m.start()]
              outer_match = None
              for fm in re.finditer(r'\n((?:static\s+)?(?:void|int)\s+\w+\s*\([^)]*\)\s*)\n?[ \t]*\{', before):
                  outer_match = fm
              if not outer_match:
                  return content, False
              outer_start = outer_match.start() + 1
              helper_text = helper_block.strip()
              helper_lines = helper_text.split('\n')
              dedented = []
              for line in helper_lines:
                  if line.startswith('\t'):
                      dedented.append(line[1:])
                  else:
                      dedented.append(line)
              helper_text = '\n'.join(dedented)
              after_helper = content[pos:]
              after_helper = re.sub(r'^\n[ \t]*\n', '\n', after_helper)
              outer_body_no_helper = content[outer_start:m.start()] + after_helper
              new_content = content[:outer_start] + helper_text + '\n\n' + outer_body_no_helper
              return new_content, True

          for path in glob.glob('drivers/media/platform/msm/vidc/*.c'):
              s = open(path).read()
              orig = s
              for helper in ['put_inst_helper', 'close_helper']:
                  s, changed = extract_nested_helper(s, helper)
                  if changed:
                      print(f'{path}: extracted {helper}')
              if s != orig:
                  open(path, 'w').write(s)
              else:
                  print(f'{path}: no change')
          PY

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex build-essential libssl-dev libncurses5-dev zip \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi g++-arm-linux-gnueabi clang
          clang --version | head -1

      - name: Configure kernel
        run: |
          cd kernel
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            REAL_CC=clang lineageos_h930_defconfig

      - name: Build kernel
        run: |
          cd kernel
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            REAL_CC=clang -j$(nproc) Image.gz-dtb \
            KCFLAGS="-Wno-error -Wno-error=unused-but-set-variable -Wno-error=enum-conversion -Wno-error=misleading-indentation -Wno-error=self-assign -Wno-error=fortify-source" CONFIG_WERROR=n \
            HOSTCFLAGS="-fcommon" > build.log 2>&1 || true
          echo "=== build exit ==="
          grep -nE "error:|Error [0-9]|undefined reference|No such file" build.log | grep -v "objdump" | head -30
          echo "=== last 15 lines ==="
          tail -15 build.log
          if [ ! -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "=== KERNEL NOT BUILT ==="
            exit 1
          fi
          echo "=== KERNEL BUILT OK ==="

      - name: Download boot17.img
        run: |
          curl -fL -o boot.img \
            "https://raw.githubusercontent.com/yueddff/android_kernel_lge_msm8998/lineage-22.2/boot17.img" \
            || { echo "boot17.img not found"; exit 1; }

      - name: Repack boot image
        run: |
          cd "$GITHUB_WORKSPACE"
          python3 <<'PY'
          import struct
          def align(x, n): return (x + n - 1) // n * n
          boot = open('boot.img', 'rb').read()
          kernel = open('kernel/out/arch/arm64/boot/Image.gz-dtb', 'rb').read()
          assert boot[:8] == b'ANDROID!', 'not a boot image'
          ks, ka, rs, ra, ss, sa, ta, ps = struct.unpack_from('<8I', boot, 8)
          kernel_off = ps
          ramdisk_off = kernel_off + align(ks, ps)
          second_off = ramdisk_off + align(rs, ps)
          new_ks = len(kernel)
          new_ramdisk_off = kernel_off + align(new_ks, ps)
          new_second_off = new_ramdisk_off + align(rs, ps)
          out = boot[:kernel_off] + kernel
          out += b'\x00' * (new_ramdisk_off - len(out))
          out += boot[ramdisk_off:second_off]
          out += b'\x00' * (new_second_off - len(out))
          if ss: out += boot[second_off:second_off + ss]
          h = bytearray(out[:ps])
          struct.pack_into('<I', h, 8, new_ks)
          with open('new-boot.img', 'wb') as f:
              f.write(bytes(h) + out[ps:])
          print('kernel bytes:', new_ks, 'ramdisk:', rs, 'pagesize:', ps)
          PY

      - name: Verify and upload
        run: |
          ls -l new-boot.img
          python3 -c "import struct; d=open('new-boot.img','rb').read(); print('magic:', d[:8], 'kernel:', struct.unpack_from('<I', d, 8)[0])"

      - name: Upload boot
        uses: actions/upload-artifact@v4
        with:
          name: boot17-4k
          path: new-boot.img
